  Upload_Sim_Artifact:
    runs-on: vivado-2023
    needs: [Build-SIM_alu_ip] #, Build-SIM_pc_ip, Build-SIM_rom_ip, Build-SIM_top]
    steps:
      - name: Upload Artifact 
        uses: actions/upload-artifact@v2
        with:
              name: "PR_RTL_build"
              path: |
                ./top-main/out/**
              if-no-files-found: error
      - name: Clean
        shell: bash
        run: rm -rf top-main

