name: RTL PR Sanity Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  Clone_Repo:
    runs-on: vivado-2023
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch
      - name: Recursive pull 
        shell: bash
        run:  |
              rm -rf * 
              git clone git@github.com:Clarkson-RISC-V-2023/top-main.git 
              cd top-main
              git checkout ${{ steps.extract_branch.outputs.branch }}
              git submodule update --init
              tree

  Build-SIM_alu_ip:
    runs-on: vivado-2023
    needs: Clone_Repo
    steps:
      - name: ALU_sanity_check
        shell: bash
        run:  |
              cd top-main 
              make alu

